defaults:
  - arena: default
  - bat: default
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: nsgaii
  - override hydra/launcher: joblib
  - _self_

hydra:
  sweeper:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    sampler:
      seed: 124
      population_size: 30
      mutation_prob: null
      crossover_prob: 0.9
      swapping_prob: 0.5
      constraints_func: null
    direction: [minimize, maximize]
    storage: sqlite:///multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}/open_space_tests_2.db
    study_name: open-space
    n_trials: 20
    n_jobs: 20
    params:
      # bat.LOUDNESS_TIME_DELAY_CAP: range(0.012, 0.052, step=0.010)
      # bat.ROTATION_TIME_DELAY_CAP: range(0.012, 0.052, step=0.010)
      # bat.SPL_THRESHOLD_FOR_ATTRACTION: range(60, 140, step=20)
      # bat.SPL_THRESHOLD_FOR_REPULSION: range(100, 140, step=10)
      # bat.CONSISTENCY_TIME_DELAY_CAP: range(0.006, 0.024, step=0.006)
      # bat.BAT_RADIAL_RESOLUTION: range(0.001, 0.006, step=0.001)
      bat.SUSTAIN_SOUNDS: range(1, 9, step=2)
      # bat.ANGLE_RANGE_FOR_REPULSION: range(30, 180, step=30)
      # bat.BAT_FRONTAL_RANGE: range(30, 180, step=30)
      bat.ANGLE_RANGE_FOR_ATTRACTION: range(30, 180, step=30)
  launcher:
    n_jobs: 20