defaults:
  - arena: default
  - bat: default
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: nsgaii
  - override hydra/launcher: joblib
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

hydra:
  sweep:
    dir: /media/adityamoger/T7/${hydra.job.name}/
  sweeper:
    # dir: /media/adityamoger/T7/${hydra.job.name}/${hydra.job.num}
    sampler:
      seed: 127
      population_size: 20
      mutation_prob: null
      crossover_prob: 0.9
      swapping_prob: 0.5
      constraints_func: null
    direction: [minimize, minimize]
    storage: sqlite:///fast_bats.db
    study_name: slow_down_turn
    n_trials: 360
    n_jobs: 20
    params:
      # bat.LOUDNESS_TIME_DELAY_CAP: range(0.010, 0.060, step=0.010)
      # bat.ROTATION_TIME_DELAY_CAP: range(0.012, 0.052, step=0.010)
      # bat.SPL_THRESHOLD_FOR_ATTRACTION: range(60, 100, step=20)
      # bat.SPL_THRESHOLD_FOR_REPULSION: range(80, 140, step=20)
      bat.CONSISTENCY_TIME_DELAY_CAP: range(0.006, 0.024, step=0.004)
      bat.BAT_RADIAL_RESOLUTION: range(0.001, 0.007, step=0.001)
      bat.BAT_FAST_SPEED: range(3, 10,step=2)
      bat.BAT_SPEED: range(0.5,3,step=1)
      # bat.SUSTAIN_SOUNDS: range(1, 9, step=2)
      # bat.ANGLE_RANGE_FOR_REPULSION: range(30, 190, step=30)
      # bat.BAT_FRONTAL_RANGE: range(30, 180, step=30)
      # bat.ANGLE_RANGE_FOR_ATTRACTION: range(30, 190, step=30)
  launcher:
    n_jobs: 20