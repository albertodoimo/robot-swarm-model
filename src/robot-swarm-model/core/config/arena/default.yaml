#time
SIM_DURATION: 60
TIME_STEP: 0.005

#agents
NUM_BATS: 10
JAMMER_RESOLUTION: 1000
OBSTACLE_COUNT: 0
OBSTACLE_RADIUS: 0.075

#arena 
ARENA_WIDTH: 10
ARENA_LENGTH: 10
WALL_RESOLUTION: 1000
ARENA_TYPE: "bounded"

#spawn region of the agents (rectangle in m, same frame as the arena)
#null = whole arena with a 0.5 m margin from the walls
SPAWN_X_MIN: 2
SPAWN_X_MAX: 3
SPAWN_Y_MIN: 2
SPAWN_Y_MAX: 3

#acoustics
REFLECTION_LOSS: 0
REFLECTION_LOSS_WALL: 0

#plotting and storage
FRAME_RATE: 15 # FPS of the final video
CLEANUP_INTERVAL: 0.1
CLEANUP_PLOT_DATA: 5000 # how many iterations to keep in memory for plotting
OUTPUT_DIR_FOR_SIMULATION: "BLANK_TEST"

#constants!
SOUND_SPEED: 343
AIR_ABSORPTION: 0
seed: 154

DISTANCE_CAP: 20