BAT_RADIUS: 0.06

#emission
CALL_DURATION: 0.01
CALL_RATE: 6
CALL_RATE_FAST: ${.CALL_RATE}
NOISE_IN_CALL_RATE: 0.05 # +- shift in call rate, to avoid perfect synchrony
CALL_ORDER: "random" # "fixed": bats call in id order, evenly spaced; "random": random initial phase + jitter
CALL_DIRECTIONALITY: 4 # 8 db drop at the back and cardioid shape
EMITTED_SPL: 99

#movement
BAT_SLOW_SPEED: 0.05 # speed of straight movement in m/s
BAT_FAST_SPEED: ${.BAT_SLOW_SPEED}
PROPENSITY_TO_CHANGE_DIRECTION: 0
ROTATION_CALL_RATE_PRODUCT: 340   # = 170 deg/s * 2 Hz
# BAT_ROTATION_SPEED: ${div:${.ROTATION_CALL_RATE_PRODUCT},${.CALL_RATE}}
BAT_ROTATION_SPEED: 170
ROTATION_TIME_DELAY_CAP: 0.010

#perception 
HEARING_THRESHOLD: 80 # threshold for hearing a sound, lower isn't computed at all
HEARING_DIRECTIONALITY: 0
BAT_RADIAL_RESOLUTION: 0.002
BAT_ANGULAR_RESOLUTION: 50
HEARING_ANGLE_THRESHOLD: 180
IMPLEMENT_SNR: "no" # no for sonoro
MINIMUM_SOUND_DETECTION_FRACTION: 0.75
INCLUDE_DIRECT_SOUNDS_IN_RESPONSE: "yes"
SPATIAL_REFERENCE_FRAME: "allocentric"
TEMPORAL_MASKING_FN_TYPE: "full"

#consistency related, not relevant for sonoro
BAT_FRONTAL_RANGE: 30
CONSISTENCY_TIME_DELAY_CAP: 0.030 # start listening after calling 
MEMORY_WINDOW_FOR_CONSISTENCY: 5
CONVERT_GRIDS_TO_ONE_HOT: "yes"
NUMBER_OF_CONSISTENT_IPIS_FOR_MOVEMENT: 3

#passive listening related
# LOUDNESS_TIME_DELAY_CAP: ${eval:'max(0.01, 1 / ${agents.CALL_RATE} - 0.15)'} #start moving after listening
LOUDNESS_TIME_DELAY_CAP: ${eval:'0.55 / ${agents.CALL_RATE}'} #start moving after listening, 55% of the ipi (= 1 / CALL_RATE - 0.15 at 3 Hz)

SUSTAIN_SOUNDS: 1 
SPL_THRESHOLD_FOR_ATTRACTION: 93
SPL_THRESHOLD_FOR_REPULSION: 99
ANGLE_RANGE_FOR_ATTRACTION: 40
ANGLE_RANGE_FOR_REPULSION: 90
NEIGHBOUR_SELECTION: "random" # "loudest": respond to the loudest cell; "random": respond to a random cell above threshold
LISTENING_WINDOW: "post_call" # "post_call": sounds heard between own call and decision; "full_ipi": every sound heard in the last inter-call interval
TURN_THROUGH_CALLS: "yes" # "yes": keep turning toward the target across own calls instead of resetting it at each call

# force based response
RESPONSE_RULE: "force" # "threshold": turn to/away from the selected cell at BAT_ROTATION_SPEED; "force": force based rule, decided once per ipi from SPL_THRESHOLD_FOR_REPULSION - received spl (TURN_THROUGH_CALLS not used)
FORCE_STIFFNESS: 1 # k: force = k * ln(10) / 20 * (SPL_THRESHOLD_FOR_REPULSION - received spl), i.e. k * ln(r / r_repulsion)
FORCE_TURNING_GAIN: 0.6 # beta: turn per time step = clip(beta * force * angle * TIME_STEP, +- FORCE_MAX_ROTATION_SPEED * TIME_STEP), angle to the sound at the decision
FORCE_SPEED_GAIN: 0.2 # alpha: speed = clip(alpha * force * cos(angle) + BAT_FAST_SPEED, 0, FORCE_MAX_SPEED)

FORCE_MAX_SPEED: 0.15 # m/s, cap on the linear speed of the force based rule
FORCE_MAX_ROTATION_SPEED: ${.BAT_ROTATION_SPEED} # deg/s, cap on the turning speed of the force based rule
FORCE_RESPONSE_DURATION: .inf # s the decided turn and speed are kept after the decision; .inf: until the next decision (one per ipi, at LOUDNESS_TIME_DELAY_CAP)

#redundant
TIME_DELAY_THRESHOLD_FOR_REPULSION: 0.05
BEHAVIOUR_RULE: "avoid-loudest-sound"
CONTROLLER_TYPE: "presence"
STORE_HEARING: "yes"