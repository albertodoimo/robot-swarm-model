BAT_RADIUS: 0.06

#emission
CALL_DURATION: 0.01
CALL_RATE: 4
CALL_RATE_FAST: ${.CALL_RATE}
NOISE_IN_CALL_RATE: 0.05 # +- shift in call rate, to avoid perfect synchrony
CALL_DIRECTIONALITY: 4 # 8 db drop at the back and cardioid shape
EMITTED_SPL: 99

#movement
BAT_SLOW_SPEED: 0.04 # spped of straight movement in m/s
BAT_FAST_SPEED: ${.BAT_SLOW_SPEED}
PROPENSITY_TO_CHANGE_DIRECTION: 0
ROTATION_CALL_RATE_PRODUCT: 340   # = 170 deg/s * 2 Hz
BAT_ROTATION_SPEED: ${div:${.ROTATION_CALL_RATE_PRODUCT},${.CALL_RATE}}
ROTATION_TIME_DELAY_CAP: 0.030

#perception 
HEARING_THRESHOLD: 85 # threshold for hearing a sound, lower isn't computed at all
HEARING_DIRECTIONALITY: 0
BAT_RADIAL_RESOLUTION: 0.002
BAT_ANGULAR_RESOLUTION: 10
HEARING_ANGLE_THRESHOLD: 180
IMPLEMENT_SNR: "no" # no for sonoro
MINIMUM_SOUND_DETECTION_FRACTION: 0.75
INCLUDE_DIRECT_SOUNDS_IN_RESPONSE: "yes"
SPATIAL_REFERENCE_FRAME: "allocentric"
TEMPORAL_MASKING_FN_TYPE: "full"

#consistency related, not relevant for sonoro
BAT_FRONTAL_RANGE: 30
CONSISTENCY_TIME_DELAY_CAP: 0.030 # start listening after calling 
MEMORY_WINDOW_FOR_CONSISTENCY: 5
CONVERT_GRIDS_TO_ONE_HOT: "yes"
NUMBER_OF_CONSISTENT_IPIS_FOR_MOVEMENT: 3

#passive listening related
LOUDNESS_TIME_DELAY_CAP: ${eval:'max(0.01, 1 / ${agents.CALL_RATE} - 0.080)'} #start moving after listening
SUSTAIN_SOUNDS: 1 
SPL_THRESHOLD_FOR_ATTRACTION: 93
SPL_THRESHOLD_FOR_REPULSION: 100
ANGLE_RANGE_FOR_ATTRACTION: 30
ANGLE_RANGE_FOR_REPULSION: 60

#redundant
TIME_DELAY_THRESHOLD_FOR_REPULSION: 0.05
BEHAVIOUR_RULE: "avoid-loudest-sound"
CONTROLLER_TYPE: "presence"
STORE_HEARING: "yes"