hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 12
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: '1'
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.launcher.n_jobs=12
    - hydra.mode=MULTIRUN
    task:
    - arena.NUM_BATS=10
    - bat.LOUDNESS_TIME_DELAY_CAP=0.03
    - bat.CONSISTENCY_TIME_DELAY_CAP=0.012
    - bat.ANGLE_RANGE_FOR_ATTRACTION=90
    - bat.SUSTAIN_SOUNDS=3
    - arena.seed=1
  job:
    name: run_simulation
    chdir: null
    override_dirname: arena.NUM_BATS=10,arena.seed=1,bat.ANGLE_RANGE_FOR_ATTRACTION=90,bat.CONSISTENCY_TIME_DELAY_CAP=0.012,bat.LOUDNESS_TIME_DELAY_CAP=0.03,bat.SUSTAIN_SOUNDS=3
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/adityamoger/Documents/GitHub/bat-swarm-model
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/adityamoger/Documents/GitHub/bat-swarm-model/src/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      bat: default
      arena: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
arena:
  SIM_DURATION: 60
  TIME_STEP: 0.001
  NUM_BATS: 10
  JAMMER_RESOLUTION: 1000
  OBSTACLE_COUNT: 0
  OBSTACLE_RADIUS: 0.075
  ARENA_WIDTH: 15
  ARENA_LENGTH: 10
  WALL_RESOLUTION: 0.51
  ARENA_TYPE: open
  REFLECTION_LOSS: 24
  REFLECTION_LOSS_WALL: 24
  FRAME_RATE: 100
  CLEANUP_INTERVAL: 0.1
  CLEANUP_PLOT_DATA: 200
  OUTPUT_DIR_FOR_SIMULATION: BLANK_TEST
  SOUND_SPEED: 343
  AIR_ABSORPTION: 1
  seed: 1
bat:
  BAT_RADIUS: 0.125
  BAT_SPEED: 1
  BAT_FAST_SPEED: 3
  PROPENSITY_TO_CHANGE_DIRECTION: 0
  BAT_ROTATION_SPEED: 360
  ROTATION_TIME_DELAY_CAP: 0.03
  CALL_DURATION: 0.002
  CALL_RATE: 10
  CALL_RATE_FAST: 20
  NOISE_IN_CALL_RATE: 0.01
  CALL_DIRECTIONALITY: 7
  EMITTED_SPL: 100
  HEARING_THRESHOLD: 60
  HEARING_DIRECTIONALITY: 2
  BAT_RADIAL_RESOLUTION: 0.002
  BAT_ANGULAR_RESOLUTION: 30
  HEARING_ANGLE_THRESHOLD: 120
  IMPLEMENT_SNR: 'yes'
  MINIMUM_SOUND_DETECTION_FRACTION: 0.75
  INCLUDE_DIRECT_SOUNDS_IN_RESPONSE: 'yes'
  SPATIAL_REFERENCE_FRAME: allocentric
  TEMPORAL_MASKING_FN_TYPE: full
  BAT_FRONTAL_RANGE: 30
  CONSISTENCY_TIME_DELAY_CAP: 0.012
  MEMORY_WINDOW_FOR_CONSISTENCY: 5
  CONVERT_GRIDS_TO_ONE_HOT: 'yes'
  NUMBER_OF_CONSISTENT_IPIS_FOR_MOVEMENT: 3
  LOUDNESS_TIME_DELAY_CAP: 0.03
  SUSTAIN_SOUNDS: 3
  SPL_THRESHOLD_FOR_ATTRACTION: 80
  SPL_THRESHOLD_FOR_REPULSION: 120
  ANGLE_RANGE_FOR_ATTRACTION: 90
  ANGLE_RANGE_FOR_REPULSION: 60
  TIME_DELAY_THRESHOLD_FOR_REPULSION: 0.05
  BEHAVIOUR_RULE: consistency
  CONTROLLER_TYPE: presence
  STORE_HEARING: 'yes'
