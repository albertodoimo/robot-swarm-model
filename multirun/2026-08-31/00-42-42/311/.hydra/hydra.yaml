hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 20
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    sampler:
      _target_: optuna.samplers.NSGAIISampler
      seed: 124
      population_size: 30
      mutation_prob: null
      crossover_prob: 0.9
      swapping_prob: 0.5
      constraints_func: null
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction:
    - minimize
    - maximize
    storage: sqlite:///optuna_study_polarization_3.db
    study_name: multi-objective-attraction-larger-group
    n_trials: 1000
    n_jobs: 20
    search_space: null
    params:
      bat.LOUDNESS_TIME_DELAY_CAP: range(0.012, 0.052, step=0.010)
      bat.ROTATION_TIME_DELAY_CAP: range(0.012, 0.052, step=0.010)
      bat.CONSISTENCY_TIME_DELAY_CAP: range(0.006, 0.024, step=0.006)
      bat.BAT_RADIAL_RESOLUTION: range(0.001, 0.006, step=0.001)
      bat.SUSTAIN_SOUNDS: range(1, 9, step=2)
    custom_search_space: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - bat.LOUDNESS_TIME_DELAY_CAP=0.012
    - bat.ROTATION_TIME_DELAY_CAP=0.041999999999999996
    - bat.CONSISTENCY_TIME_DELAY_CAP=0.006
    - bat.BAT_RADIAL_RESOLUTION=0.003
    - bat.SUSTAIN_SOUNDS=1
  job:
    name: run_simulation_w_score_calcs
    chdir: null
    override_dirname: bat.BAT_RADIAL_RESOLUTION=0.003,bat.CONSISTENCY_TIME_DELAY_CAP=0.006,bat.LOUDNESS_TIME_DELAY_CAP=0.012,bat.ROTATION_TIME_DELAY_CAP=0.041999999999999996,bat.SUSTAIN_SOUNDS=1
    id: run_simulation_w_score_calcs_311
    num: 311
    config_name: optimization_config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/adityamoger/Documents/GitHub/bat-swarm-model
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/adityamoger/Documents/GitHub/bat-swarm-model/src/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/adityamoger/Documents/GitHub/bat-swarm-model/multirun/2026-08-31/00-42-42/311
    choices:
      bat: default
      arena: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: optuna
      hydra/sweeper/sampler: nsgaii
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
