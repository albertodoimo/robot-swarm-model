defaults:
  - arena: default
  - bat: default
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: nsgaii
  - override hydra/launcher: joblib
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

hydra:
  sweep:
    dir: ./multirun/${hydra.job.name}/
  sweeper:
    # dir: /media/adityamoger/T7/${hydra.job.name}/${hydra.job.num}
    sampler:
      seed: 127
      population_size: 128
      mutation_prob: null
      crossover_prob: 0.9
      swapping_prob: 0.5
      constraints_func: null
    direction: [minimize, minimize]
    storage: sqlite:///sensitivity_analysis_optimize.db
    study_name: sensitivity_analysis_optimize
    n_trials: 100000
    n_jobs: 128
    params:
      agents.sonoro.CALL_RATE_FAST: choice(10, 20)
      agents.sonoro.CALL_DIRECTIONALITY: choice(4, 7, 10)
      agents.sonoro.EMITTED_SPL: choice(80, 100, 140)
      agents.sonoro.HEARING_THRESHOLD: choice(20, 40, 60, 80)
      agents.sonoro.BAT_RADIAL_RESOLUTION: choice(0.002, 0.004, 0.006)
      agents.sonoro.BAT_ANGULAR_RESOLUTION: choice(15, 30, 60)
      agents.sonoro.BAT_FRONTAL_RANGE: choice(30, 60, 90)
      agents.sonoro.CONSISTENCY_TIME_DELAY_CAP: choice(0.008, 0.011, 0.014, 0.026)
      agents.sonoro.MEMORY_WINDOW_FOR_CONSISTENCY: choice(1, 3, 5, 7)
      arena.seed: choice(55, 89, 144, 233, 377)
  launcher:
    n_jobs: 128