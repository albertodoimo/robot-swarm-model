defaults:
  - arena: default
  - bat: default
  - override hydra/sweeper: basic
  - override hydra/launcher: joblib
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

hydra:
  job:
    name: sensitivity_analysis

  # Parent directory for this entire grid search.
  sweep:
    dir: ./multirun/${hydra.job.name}
    subdir: ${hydra.job.num}

  # Built-in Hydra Cartesian-product/grid sweeper.
  sweeper:
    params:
      bat.CALL_RATE_FAST: choice(10, 20)
      bat.CALL_DIRECTIONALITY: choice(4, 7, 10)
      bat.EMITTED_SPL: choice(80, 100, 140)
      bat.HEARING_THRESHOLD: choice(20, 40, 60, 80)
      bat.BAT_RADIAL_RESOLUTION: choice(0.002, 0.004, 0.006)
      bat.BAT_ANGULAR_RESOLUTION: choice(15, 30, 60)
      bat.BAT_FRONTAL_RANGE: choice(30, 60, 90)
      bat.CONSISTENCY_TIME_DELAY_CAP: choice(0.008, 0.011, 0.014, 0.026)
      bat.MEMORY_WINDOW_FOR_CONSISTENCY: choice(1, 3, 5, 7)
      arena.seed: choice(55, 89, 144, 233, 377)

  # Parallel local workers within the single Slurm allocation.
  launcher:
    n_jobs: 20
    batch_size: 1