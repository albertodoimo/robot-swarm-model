defaults:
  - arena: default
  - bat: default
  - override hydra/launcher: submitit_slurm
  - _self_
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  launcher:
    timeout_min: 1440 # 24 hours
    partition: main

    # 10 TB = 10240 GB
    mem_gb: 10240

    cpus_per_task: 128
    nodes: 1
    tasks_per_node: 1
    name: dynamic_model

    # Where Submitit stores job metadata / pickles
    submitit_folder: ${hydra:runtime.output_dir}/submitit_logs

    additional_parameters:
      mail-type: ALL
      mail-user: aditya.moger@uni-konstanz.de
      output: jammingexperiment_14_10_%j.out
      error: jammingexperiment_14_10_%j.err
      export: "ALL,OMP_NUM_THREADS=1,MKL_NUM_THREADS=1,OPENBLAS_NUM_THREADS=1,NUMEXPR_NUM_THREADS=1"